# Netlify configuration for Vite React TypeScript project

[build]
# Command to build the project
command = "npm run build"
# Directory to deploy (Vite output folder)
publish = "dist"
# Environment where functions would be deployed (if using them)
functions = "netlify/functions"

[build.environment]
# Node version for building
NODE_VERSION = "20"

# Redirect all requests to index.html for client-side routing (SPA)
[[redirects]]
from = "/*"
to = "/index.html"
status = 200

# Headers for performance and security
[[headers]]
for = "/*"
[headers.values]
# Cache static assets
Cache-Control = "public, max-age=3600"

[[headers]]
for = "/assets/*"
[headers.values]
# Cache built assets longer (they have hash in filename)
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/index.html"
[headers.values]
# Don't cache HTML file to ensure users get latest version
Cache-Control = "public, max-age=0, must-revalidate"

# Security headers
[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
X-Frame-Options = "DENY"
X-XSS-Protection = "1; mode=block"
Referrer-Policy = "strict-origin-when-cross-origin"
